name: "Test"
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Go setup
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Run tests
        run: go test ./...
