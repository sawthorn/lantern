{{ define "album_card" }}
<a
  href="/albums/{{ .ID }}"
  class="
    group block
    min-w-0
  "
>
  <div class="overflow-hidden rounded-xl p-2 transition group-hover:bg-neutral-800">
    <div class="aspect-square w-full overflow-hidden rounded-xl">
      <img
        src="/api/covers/{{ .ID }}"
        alt="{{ .Title }} cover"
        loading="lazy"
        class="
          h-full w-full
          object-cover
        "
      />
    </div>

    <div class="min-w-0 p-3">
      <div
        class="
          truncate
          text-base font-semibold
          text-neutral-100
        "
        title="{{ .Title }}"
      >
        {{ .Title }}
      </div>

      <div
        class="
          mt-0.5 truncate
          text-sm
          text-neutral-400
        "
        title="{{ .AlbumArtist }}"
      >
        {{ .AlbumArtist }}
      </div>

      <div class="mt-2 flex gap-2 text-xs text-neutral-500">
        <span>{{ .Year }}</span>
        <span>•</span>
        <span>{{ .TotalTracks }} {{if eq .TotalTracks 1}}track{{else}}tracks{{end}}</span>
      </div>
    </div>
  </div>
</a>
{{ end }}
