{{define "player"}}
<audio id="player"></audio>

<div class="player-shell" id="player-shell">
    <div class="player-card" id="player-card">

        <!-- Controls -->
        <div class="player-controls">
            <button class="ctrl-btn" id="btn-prev" title="Previous track" aria-label="Previous track">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                  fill="currentColor">
                  <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" />
              </svg>
            </button>

            <button class="play-btn" id="btn-play" aria-label="Play or pause">
              <svg id="icon-play" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                  fill="currentColor">
                  <path d="M8 5v14l11-7z" />
              </svg>
              <svg id="icon-pause" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                  fill="currentColor" style="display:none;">
                  <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
              </svg>
            </button>

            <button class="ctrl-btn" id="btn-next" title="Next track" aria-label="Next track">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                  fill="currentColor">
                  <path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z" />
              </svg>
            </button>
        </div>

        <!-- Track info -->
        <div class="player-track-info">
            <div id="track-art" class="track-art"></div>

            <div class="player-track-copy">
                <p id="track-title">No track loaded</p>
                <p id="track-artist">—</p>
            </div>
        </div>

        <!-- Timeline -->
        <div class="player-timeline">
            <div class="seek-wrap" id="seek-wrap">
                <div class="seek-track">
                    <div class="seek-fill" id="seek-fill"></div>
                </div>

                <div class="seek-thumb" id="seek-thumb"></div>

                <input
                    type="range"
                    class="seek-input"
                    id="seek-input"
                    min="0"
                    max="100"
                    value="0"
                    step="0.1"
                    aria-label="Track position"
                />
            </div>

            <div class="player-times">
                <span id="current-time" class="mono">0:00</span>
                <span id="duration" class="mono">0:00</span>
            </div>
        </div>

        <!-- Volume -->
        <div class="volume player-volume">
            <button class="ctrl-btn" id="btn-mute" aria-label="Mute">
              <svg id="icon-vol" xmlns="http://www.w3.org/2000/svg"
                    width="22" height="22" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                  <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                  <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
              </svg>

              <svg id="icon-mute" xmlns="http://www.w3.org/2000/svg"
                    width="22" height="22" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round"
                    hidden>
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                  <line x1="23" y1="9" x2="17" y2="15" />
                  <line x1="17" y1="9" x2="23" y2="15" />
              </svg>
            </button>

            <div class="volume-popover">
                <div class="volume-panel">
                    <input
                        id="vol-input"
                        class="volume-slider"
                        type="range"
                        min="0"
                        max="1"
                        step="0.01"
                        value="0.8"
                        aria-label="Volume"
                    />

                    <span id="vol-display" class="mono volume-value">80</span>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="/static/js/playerScript.js" type="module"></script>
{{end}}
