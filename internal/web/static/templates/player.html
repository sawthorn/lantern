{{define "player"}}
<audio id="player"></audio>
<div class="flex justify-center fixed w-full px-8 bottom-5">
    <div class="player-card flex items-center justify-between gap-4 p-[1rem]">

        <div class="flex justify-start gap-4">
            <!-- ── Controls ── -->
            <div class="flex items-center justify-between gap-2">
                <!-- shuffle -->
                <!-- <button class="ctrl-btn" id="btn-shuffle" title="Shuffle" aria-label="Shuffle">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 3 21 3 21 8" />
                            <line x1="4" y1="20" x2="21" y2="3" />
                            <polyline points="21 16 21 21 16 21" />
                            <line x1="15" y1="15" x2="21" y2="21" />
                            <line x1="4" y1="4" x2="9" y2="9" />
                        </svg>
                    </button> -->

                <!-- prev -->
                <button class="ctrl-btn" id="btn-prev" title="Restart" aria-label="Restart">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                        fill="currentColor">
                        <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" />
                    </svg>
                </button>

                <!-- play/pause -->
                <button class="play-btn" id="btn-play" aria-label="Play/Pause">
                    <svg id="icon-play" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                        fill="currentColor">
                        <path d="M8 5v14l11-7z" />
                    </svg>
                    <svg id="icon-pause" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                        fill="currentColor" style="display:none;">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                    </svg>
                </button>

                <!-- next -->
                <button class="ctrl-btn" id="btn-next" title="Skip to end" aria-label="Skip">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                        fill="currentColor">
                        <path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z" />
                    </svg>
                </button>
            </div>

            <!-- ── Track info ── -->
            <div class="flex items-center gap-4">
                <div id="track-art" class="track-art rounded-xl" width="22" height="22">
                </div>
                <div class="flex-1 min-w-0">
                    <p id="track-title"
                        style="color:var(--text); font-size:15px; font-weight:600; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                        No track loaded</p>
                    <p id="track-artist" style="color:var(--muted); font-size:13px; margin:4px 0 0;">—</p>
                </div>
            </div>
        </div>

        <div class="flex flex-col w-[80%]">
            <!-- ── Seek bar ── -->
            <div class="seek-wrap mb-3" id="seek-wrap">
                <div class="seek-track">
                    <div class="seek-fill" id="seek-fill"></div>
                </div>
                <div class="seek-thumb" id="seek-thumb"></div>
                <input type="range" class="seek-input" id="seek-input" min="0" max="100" value="0" step="0.1" />
            </div>

            <!-- ── Time ── -->
            <div class="flex justify-between">
                <span id="current-time" class="mono" style="color:var(--muted); font-size:12px;">0:00</span>
                <span id="duration" class="mono" style="color:var(--muted); font-size:12px;">0:00</span>
            </div>
        </div>

        <!-- Volume -->
        <div class="volume">
            <button class="ctrl-btn" id="btn-mute" aria-label="Mute">
                <svg id="icon-vol" xmlns="http://www.w3.org/2000/svg"
                     width="22" height="22" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                </svg>

                <svg id="icon-mute" xmlns="http://www.w3.org/2000/svg"
                     width="22" height="22" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round"
                     hidden>
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                    <line x1="23" y1="9" x2="17" y2="15" />
                    <line x1="17" y1="9" x2="23" y2="15" />
                </svg>
            </button>

            <div class="volume-popover">
                <div class="volume-panel">
                    <input
                        id="vol-input"
                        class="volume-slider"
                        type="range"
                        min="0"
                        max="1"
                        step="0.01"
                        value="0.8"
                    />

                    <span id="vol-display" class="mono volume-value">
                        80
                    </span>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/js/playerScript.js" type="module"></script>
</div>
    {{end}}
